name: CI

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CI wiring for check-velite-output
        run: node scripts/check-velite-output.mjs --verify-ci-wiring

      - name: Build 1 (with drafts)
        run: pnpm build
        env:
          BLOG_INCLUDE_DRAFTS: "1"

      - name: Check velite output before tests
        run: node scripts/check-velite-output.mjs

      - name: Unit tests
        run: pnpm test

      - name: Clean for Build 2
        run: rm -rf .velite .next

      - name: Build 2 (production-mode)
        run: pnpm build

      - name: Check velite output before tests
        run: node scripts/check-velite-output.mjs

      - name: Verify production build (Build 2)
        run: node scripts/verify-production-build.mjs
