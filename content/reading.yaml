# Reading, mirrored from StoryGraph by hand.
#
# StoryGraph is behind a Cloudflare bot challenge and an auth wall, so this
# cannot be fetched at build or request time. This file is the whole data
# source: replace its contents when your reads change, drop the cover into
# content/reading/, and the /now Reading section follows.
#
# An entry with no `finished` date is Currently Reading, rendered in file order.
# An entry with a `finished` date is Recently Read, sorted newest-first and
# capped at three on the page.
#
# `url` is the book's StoryGraph page — each card links to it.
