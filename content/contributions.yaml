- repo: "madmatt112/claude-tmux-resurrect"
  repoUrl: "https://github.com/madmatt112/claude-tmux-resurrect"
  title: "tmux-resurrect plugin that resumes each Claude Code session in its pane"
  description: "A tmux-resurrect companion that brings each Claude Code session back in the pane where it ran after a restart. It rewrites each saved pane command to resume the right session instead of starting a fresh one, by reading Claude's on-disk session files. Linux and WSL only."
  date: "2026-09-15"
  language: "Shell"
