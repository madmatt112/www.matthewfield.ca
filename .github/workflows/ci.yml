name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check authoring docs
        run: pnpm check:authoring-docs

      - name: Check playground CSS
        run: pnpm check:playground-css

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify getPublishedPosts callers
        run: node scripts/verify-getPublishedPosts-callers.mjs

      - name: "Verify paired-merge for 6+7"
        run: node scripts/verify-paired-merge.mjs

      - name: "Verify canary↔regex-list paired-merge"
        run: node scripts/verify-canary-regex-pair.mjs

      - name: "Verify content canary↔regex-list paired-merge"
        run: node scripts/verify-content-canary-regex-pair.mjs

      - name: "Self-tests for check-velite-output"
        run: node --test scripts/check-velite-output.test.mjs

      - name: "Self-tests for check-authoring-docs"
        run: node --test scripts/check-authoring-docs.test.mjs

      - name: "Self-tests for check-playground-css"
        run: node --test scripts/check-playground-css.test.mjs

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check velite output
        run: node scripts/check-velite-output.mjs

      - name: Validate feed
        run: node scripts/validate-feed.mjs
        env:
          NODE_OPTIONS: "--no-warnings=ExperimentalWarning"

      - name: Pagefind crawl
        if: vars.PAGEFIND_ENABLED != 'false'
        run: pnpm build:search

      - name: Verify Pagefind index
        if: vars.PAGEFIND_ENABLED != 'false'
        run: node scripts/verify-pagefind-no-drafts.mjs

      - name: Upload Pagefind manifest
        if: always() && vars.PAGEFIND_ENABLED != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pagefind-manifest
          path: public/pagefind/**

      # Optional CI-driven Vercel deploy. Only runs when DEPLOY_VIA_CI=true;
      # the default is Vercel's native GitHub integration (preview on PRs).
      - name: Check Vercel auto-deploy status
        if: vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/check-vercel-auto-deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          MIGRATION_DEADLINE: ${{ vars.MIGRATION_DEADLINE }}

      - name: Vercel build
        if: vars.DEPLOY_VIA_CI == 'true'
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }} ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Pagefind artifact in .vercel/output
        if: vars.PAGEFIND_ENABLED != 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/verify-pagefind-artifact.mjs

      - name: Vercel deploy
        id: vercel_deploy
        if: vars.DEPLOY_VIA_CI == 'true'
        run: |
          DEPLOY_URL=$(pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} ${{ github.ref == 'refs/heads/main' && '--prod' || '' }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Warn deploying without Pagefind
        if: always() && vars.PAGEFIND_ENABLED == 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/warn-no-pagefind.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
          DEPLOY_URL: ${{ steps.vercel_deploy.outputs.deploy_url }}
