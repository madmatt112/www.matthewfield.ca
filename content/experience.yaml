- organisation: "CrowdStrike"
  organisationUrl: "https://www.crowdstrike.com"
  title: "Infrastructure Engineer III"
  start: "2021-01"
  end: "2026-01"
  location: "Remote"
  summary: "Member of the Infrastructure Engineering Kubernetes team inside the Product Platform organization. Our 40+ clusters ran the bulk of the Falcon Platform's microservices and its data science and ML workflows, in public cloud and in our own datacenters."
  tech:
    - "kubernetes"
    - "golang"
    - "python"
    - "terraform"
    - "temporal"
    - "fluxcd"
    - "cilium"
    - "prometheus"
    - "chef"
    - "aws"
    - "gcp"
    - "oci"
  deliveries:
    - title: "Rudder"
      role: "Architect & Lead Engineer"
      project: "rudder"
      body: "A single pane of glass for the Kubernetes fleet: one control surface for fleet visibility and cluster operations, replacing an aging Ansible AWX system with a Temporal-powered workflow engine."
    - title: "Temporal.io Platform"
      role: "Architect & Lead Engineer"
      body: "CrowdStrike's first internal Temporal deployment, built from scratch with no prior art and no internal managed offering to work from. It became the durable execution backbone for Infrastructure Engineering's cluster operations, and the foundation Rudder's workflow engine was built on."
      highlights:
        - "Architected the cluster topology — running on Kubernetes, backed by Amazon RDS PostgreSQL, with a namespace strategy and multi-region HA across environments."
        - "Defined the canonical Go and Python worker, workflow, and activity structure, so the teams that followed started from a convention rather than a blank page."
        - "Put workflow code through the same build, test, and deploy pipelines as application services, which kept workflows-as-code on equal footing with the rest of the platform."
        - "Wrote the runbook library from scratch — upgrades, namespace management, worker scaling, incident response — the operational base a managed offering would have supplied."
  highlights:
    - "Owned build, management, and lifecycle of 40+ Kubernetes clusters across AWS, GCP, OCI, and on-prem Canonical MaaS, spread across North America and Europe."
    - "Led GPU-on-Kubernetes as the team's subject-matter expert. Reworked NVIDIA's GPU Operator for egress-restricted networks and internal repositories, turning multi-day upgrade debugging into a YAML change."
    - "Built custom FluxCDTeam CRDs mapping team shapes — namespaces, RBAC, org-level definitions — onto our managed FluxCD service, live-synced from the internal Teams API so environments came from a definition, not by hand."
    - "Kept the whole 40+ cluster fleet on a regular update cadence for Kubernetes, Ubuntu, kernel, containerd, and Cilium, so no cluster drifted onto an unsupported version."
    - "Partnered with 12+ service teams to right-size and migrate dozens of microservices onto the platform."
    - "Ran the Prometheus, Thanos, and Grafana stack across multi-cloud and on-prem clusters, carried the pager on the on-call rotation, and led several incident retrospectives and postmortems."
    - "Built the Terraform modules and managed the state behind provisioning across cloud tenancies, with Chef handling configuration and drift."

